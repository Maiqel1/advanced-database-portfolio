services:
  postgres:
    image: postgres:16
    container_name: hospital-postgres
    restart: unless-stopped
    shm_size: 1gb
    command: ["postgres", "-c", "max_prepared_transactions=10"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./:/portfolio:ro
      - exchange:/exchange

  mongo:
    image: mongo:8.0
    container_name: hospital-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
      - ./:/portfolio:ro
      - exchange:/exchange

  mongo2:
    image: mongo:8.0
    container_name: hospital-mongo-2
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - mongodata2:/data/db
      - ./:/portfolio:ro

  mongo3:
    image: mongo:8.0
    container_name: hospital-mongo-3
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - mongodata3:/data/db
      - ./:/portfolio:ro

volumes:
  pgdata:
  mongodata:
  mongodata2:
  mongodata3:
  exchange:
